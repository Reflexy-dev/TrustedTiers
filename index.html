<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustedTiers - Leaderboard</title>
  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #151922;
      --card-border: #232a3b;
      --gold: #ffbe2e;
      --silver: #b0c0d0;
      --bronze: #d97736;
      --grey-tier: #4b5563;
      --accent-blue: #5865f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* HEADER & TITLE */
    header {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    /* BARRA CATEGORIE (GAMEMODES) */
    .nav-modes {
      width: 100%;
      max-width: 1200px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 5px 5px 15px 5px;
      margin-bottom: 25px;
      scrollbar-width: thin;
      scrollbar-color: #232a3b transparent;
    }

    .mode-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #8b9bb4;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.25s ease;
      min-width: 85px;
      flex-shrink: 0;
    }

    .mode-btn img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .mode-btn:hover {
      background: #1c2230;
      color: #ffffff;
      border-color: #3b4760;
      transform: translateY(-2px);
    }

    .mode-btn.active {
      background: #1e2638;
      border-color: var(--accent-blue);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.35);
    }

    /* CONTENITORE PRINCIPALE */
    #content {
      width: 100%;
      max-width: 1200px;
    }

    /* LAYOUT OVERALL */
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .rank-badge {
      font-size: 1.5rem;
      font-weight: 900;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      color: #8b9bb4;
    }

    /* SKIN INGRANDITA */
    .player-avatar {
      width: 70px;
      height: 70px;
      border-radius: 10px;
      object-fit: cover;
      background: rgba(0,0,0,0.3);
    }

    .player-details h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
    }

    .player-details p {
      font-size: 0.9rem;
      color: #6c7a93;
      margin-top: 2px;
    }

    /* COLORI REGIONI */
    .region-tag {
      font-weight: 800;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 6px;
      color: white;
    }

    .region-tag.EU { background: #16a34a; } /* Verde */
    .region-tag.NA { background: #dc2626; } /* Rosso */
    .region-tag.AS { background: #0284c7; } /* Azzurro / Blu Notte bilanciato */

    /* SCIE LUMINOSE PODI (1°, 2°, 3°) */
    .player-card.rank-1 {
      border-color: rgba(255, 190, 46, 0.6);
      box-shadow: 0 0 20px rgba(255, 190, 46, 0.25), inset 5px 0 0 var(--gold);
    }
    .player-card.rank-1 .rank-badge {
      background: var(--gold);
      color: #000;
    }

    .player-card.rank-2 {
      border-color: rgba(176, 192, 208, 0.6);
      box-shadow: 0 0 20px rgba(176, 192, 208, 0.2), inset 5px 0 0 var(--silver);
    }
    .player-card.rank-2 .rank-badge {
      background: var(--silver);
      color: #000;
    }

    .player-card.rank-3 {
      border-color: rgba(217, 119, 54, 0.6);
      box-shadow: 0 0 20px rgba(217, 119, 54, 0.2), inset 5px 0 0 var(--bronze);
    }
    .player-card.rank-3 .rank-badge {
      background: var(--bronze);
      color: #fff;
    }

    /* LAYOUT GAMEMODES (TIER COLUMNS) */
    .tier-columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 15px;
      width: 100%;
    }

    .tier-col {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tier-header {
      text-align: center;
      padding: 10px;
      font-weight: 800;
      border-radius: 8px;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* COLORI TIER (Tier 4 e Tier 5 Grigio) */
    .t1 { background: rgba(255, 190, 46, 0.15); color: var(--gold); border: 1px solid var(--gold); box-shadow: 0 0 10px rgba(255, 190, 46, 0.2); }
    .t2 { background: rgba(176, 192, 208, 0.15); color: var(--silver); border: 1px solid var(--silver); }
    .t3 { background: rgba(217, 119, 54, 0.15); color: var(--bronze); border: 1px solid var(--bronze); }
    .t4 { background: rgba(75, 85, 99, 0.2); color: #9ca3af; border: 1px solid var(--grey-tier); }
    .t5 { background: rgba(75, 85, 99, 0.2); color: #9ca3af; border: 1px solid var(--grey-tier); }

    .tier-subgroup {
      font-size: 0.75rem;
      font-weight: 800;
      color: #6c7a93;
      text-transform: uppercase;
      margin-top: 5px;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
    }

    .tier-player-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
    }

    /* SKIN NEI TIER INGRANDITA */
    .tier-player-item img {
      width: 45px;
      height: 45px;
      border-radius: 6px;
    }

    .tier-player-item span {
      font-size: 0.9rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- HEADER CON TITOLO -->
  <header>
    <div class="brand-title">TrustedTiers</div>
  </header>

  <!-- NAVBAR GAMEMODES -->
  <div class="nav-modes">
    <button class="mode-btn active" onclick="switchCategory('overall', this)">
      <img src="https://minecraft.wiki/images/Nether_Star_JE3_BE2.png" alt="Overall">
      <span>Overall</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('sword', this)">
      <img src="https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png?24296" alt="Sword">
      <span>Sword</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('axe', this)">
      <img src="https://minecraft.wiki/images/Diamond_Axe_JE3_BE3.png?99125" alt="Axe">
      <span>Axe</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('uhc', this)">
      <img src="https://minecraft.wiki/images/Golden_Apple_JE2_BE2.png?aa827" alt="UHC">
      <span>UHC</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('diapot', this)">
      <img src="https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2.png?d45f1" alt="DiaPot">
      <span>DiaPot</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('nethpot', this)">
      <img src="https://minecraft.wiki/images/Netherite_Sword_JE2_BE2.png?8e866" alt="NethPot">
      <span>NethPot</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('diasmp', this)">
      <img src="https://minecraft.wiki/images/Chorus_Fruit_JE2_BE2.png?c8e41" alt="DiaSMP">
      <span>DiaSMP</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('smp', this)">
      <img src="https://minecraft.wiki/images/Shield_JE2_BE1.png?4837d" alt="SMP">
      <span>SMP</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('mace', this)">
      <img src="https://minecraft.wiki/images/Mace_JE1_BE1.png?90f67" alt="Mace">
      <span>Mace</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('spearmace', this)">
      <img src="https://minecraft.wiki/images/Netherite_Spear_JE1_BE2.png?8c3ba" alt="SpearMace">
      <span>SpearMace</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('cart', this)">
      <img src="https://minecraft.wiki/images/Minecart_with_TNT_%28item%29_JE2_BE2.png?61a90" alt="Cart">
      <span>Cart</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('endcrystal', this)">
      <img src="https://minecraft.wiki/images/End_Crystal_%28item%29_JE2_BE2.png?e1ecd" alt="Crystal">
      <span>Crystal</span>
    </button>
  </div>

  <!-- CONTENUTO DINAMICO -->
  <div id="content"></div>

  <script>
    // DATI ESEMPIO
    const mockOverall = [
      { rank: 1, name: "Marlowww", points: 450, region: "NA" },
      { rank: 2, name: "ItzRealMe", points: 330, region: "NA" },
      { rank: 3, name: "coldified", points: 326, region: "EU" },
      { rank: 4, name: "WeReflexy", points: 290, region: "AS" }
    ];

    // Struttura divisa in High Tier (HT) e Low Tier (LT)
    const mockTiers = {
      tier1: { ht: ["WeReflexy"], lt: ["K1RBE"] },
      tier2: { ht: ["Snoowwyyyyyy"], lt: ["amacq"] },
      tier3: { ht: ["_MannerL3gendOP"], lt: ["BlightMCYT"] },
      tier4: { ht: ["QuadridBoost"], lt: ["ewhu"] },
      tier5: { ht: ["ItzJacobXD"], lt: ["1105sldjfrnf"] }
    };

    function renderTierPlayers(playerArray) {
      if (!playerArray || playerArray.length === 0) return '';
      return playerArray.map(p => `
        <div class="tier-player-item">
          <img src="https://render.crafty.gg/3d/bust/${p}" alt="${p}">
          <span>${p}</span>
        </div>
      `).join('');
    }

    function switchCategory(category, btnElement) {
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      const container = document.getElementById('content');

      if (category === 'overall') {
        container.className = 'leaderboard-list';
        container.innerHTML = mockOverall.map(p => `
          <div class="player-card rank-${p.rank <= 3 ? p.rank : 'other'}">
            <div class="player-info">
              <div class="rank-badge">#${p.rank}</div>
              <img class="player-avatar" src="https://render.crafty.gg/3d/bust/${p.name}" alt="${p.name}">
              <div class="player-details">
                <h3>${p.name}</h3>
                <p>${p.points} pts</p>
              </div>
            </div>
            <span class="region-tag ${p.region}">${p.region}</span>
          </div>
        `).join('');
      } else {
        container.className = 'tier-columns';
        container.innerHTML = [1, 2, 3, 4, 5].map(tNum => `
          <div class="tier-col">
            <div class="tier-header t${tNum}">Tier ${tNum}</div>
            
            <div class="tier-subgroup">HT${tNum}</div>
            ${renderTierPlayers(mockTiers[`tier${tNum}`].ht)}
            
            <div class="tier-subgroup">LT${tNum}</div>
            ${renderTierPlayers(mockTiers[`tier${tNum}`].lt)}
          </div>
        `).join('');
      }
    }

    // Inizializza sulla scheda Overall
    switchCategory('overall', document.querySelector('.mode-btn.active'));
  </script>
</body>
</html>
