<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustedTiers - Leaderboard</title>
  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #151922;
      --card-bg-hover: #1c2230;
      --card-border: #232a3b;
      --gold: #ffbe2e;
      --silver: #b0c0d0;
      --bronze: #d97736;
      --grey-tier: #374151;
      --accent-blue: #5865f2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 1250px;
      margin-bottom: 25px;
    }

    .brand-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    /* BARRA CATEGORIE GAMEMODES */
    .nav-modes {
      width: 100%;
      max-width: 1250px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 25px;
      scrollbar-width: thin;
      scrollbar-color: #232a3b transparent;
    }

    .mode-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #8b9bb4;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      min-width: 85px;
      flex-shrink: 0;
    }

    .mode-btn img {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    .mode-btn:hover {
      background: var(--card-bg-hover);
      color: #ffffff;
      border-color: #3b4760;
    }

    .mode-btn.active {
      background: #1e2638;
      border-color: var(--accent-blue);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.35);
    }

    #content {
      width: 100%;
      max-width: 1250px;
    }

    /* OVERALL LEADERBOARD CARD */
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      display: grid;
      grid-template-columns: 320px 100px 1fr;
      align-items: center;
      padding-right: 20px;
      position: relative;
      overflow: hidden;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .player-card:hover {
      background-color: var(--card-bg-hover);
      border-color: #3f4d6d;
      transform: translateX(3px);
    }

    /* ETICHETTA TRAPEZIO RANK + SKIN */
    .rank-tag-box {
      display: flex;
      align-items: center;
      background: #232a3b;
      padding: 0 25px 0 15px;
      clip-path: polygon(0 0, 88% 0, 100% 100%, 0% 100%);
      height: 75px;
      gap: 15px;
      margin-right: 15px;
    }

    .rank-num {
      font-size: 1.8rem;
      font-weight: 900;
      font-style: italic;
      color: #ffffff;
      min-width: 45px;
    }

    .player-avatar {
      width: 60px;
      height: 60px;
      object-fit: cover;
    }

    .player-main-info {
      display: flex;
      align-items: center;
    }

    .player-details h3 {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffffff;
    }

    .player-details .title-pts {
      font-size: 0.82rem;
      color: #637394;
      font-weight: 600;
      margin-top: 2px;
    }

    .player-details .title-pts span { color: #8b9bb4; }

    /* ANIMAZIONI DI ILLUMINAZIONE PODI */
    @keyframes goldGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(255, 190, 46, 0.2); }
      50% { box-shadow: 0 0 22px rgba(255, 190, 46, 0.55); }
    }
    @keyframes silverGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(176, 192, 208, 0.15); }
      50% { box-shadow: 0 0 20px rgba(176, 192, 208, 0.45); }
    }
    @keyframes bronzeGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(217, 119, 54, 0.15); }
      50% { box-shadow: 0 0 20px rgba(217, 119, 54, 0.45); }
    }

    .player-card.rank-1 {
      border-color: rgba(255, 190, 46, 0.8);
      animation: goldGlow 3s infinite ease-in-out;
    }
    .player-card.rank-1 .rank-tag-box { background: var(--gold); }
    .player-card.rank-1 .rank-num { color: #000; }

    .player-card.rank-2 {
      border-color: rgba(176, 192, 208, 0.8);
      animation: silverGlow 3s infinite ease-in-out 0.5s;
    }
    .player-card.rank-2 .rank-tag-box { background: var(--silver); }
    .player-card.rank-2 .rank-num { color: #000; }

    .player-card.rank-3 {
      border-color: rgba(217, 119, 54, 0.8);
      animation: bronzeGlow 3s infinite ease-in-out 1s;
    }
    .player-card.rank-3 .rank-tag-box { background: var(--bronze); }
    .player-card.rank-3 .rank-num { color: #fff; }

    /* REGIONI E TIERS */
    .region-container {
      display: flex;
      justify-content: center;
    }

    .region-tag {
      font-weight: 800;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 8px;
      color: white;
      text-align: center;
    }
    .region-tag.EU { background: #16a34a; }
    .region-tag.NA { background: #dc2626; }
    .region-tag.AS { background: #0284c7; }

    .tested-tiers-list {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .tier-badge-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .icon-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0f1219;
      border: 1px solid #2a3245;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-circle img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .tier-subtext {
      font-size: 0.7rem;
      font-weight: 800;
    }
    .tier-subtext.t1 { color: var(--gold); }
    .tier-subtext.t2 { color: var(--silver); }
    .tier-subtext.t3 { color: var(--bronze); }
    .tier-subtext.t4, .tier-subtext.t5 { color: #9ca3af; }

    /* SCHEDA GAMEMODES */
    .tier-columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 15px;
      width: 100%;
    }

    .tier-col {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tier-header {
      text-align: center;
      padding: 10px;
      font-weight: 800;
      border-radius: 8px;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .t1-head { border: 1px solid var(--gold); color: var(--gold); background: rgba(255, 190, 46, 0.05); }
    .t2-head { border: 1px solid var(--silver); color: var(--silver); background: rgba(176, 192, 208, 0.05); }
    .t3-head { border: 1px solid var(--bronze); color: var(--bronze); background: rgba(217, 119, 54, 0.05); }
    .t4-head, .t5-head { border: 1px solid var(--grey-tier); color: #9ca3af; background: rgba(75, 85, 99, 0.05); }

    .tier-player-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: #0f1219;
      border: 1px solid #212838;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .tier-player-card:hover {
      background: #181d28;
      border-color: #3b4760;
    }

    .tier-player-card img {
      width: 36px;
      height: 36px;
      object-fit: cover;
    }

    .tier-player-card span {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">TrustedTiers</div>
  </header>

  <!-- GAMEMODES NAVBAR -->
  <div class="nav-modes">
    <button class="mode-btn active" onclick="switchCategory('overall', this)">
      <img src="https://minecraft.wiki/images/Nether_Star_JE3_BE2.png" alt="Overall">
      <span>Overall</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('Sword', this)">
      <img src="https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png?24296" alt="Sword">
      <span>Sword</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('Axe', this)">
      <img src="https://minecraft.wiki/images/Diamond_Axe_JE3_BE3.png?99125" alt="Axe">
      <span>Axe</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('UHC', this)">
      <img src="https://minecraft.wiki/images/Golden_Apple_JE2_BE2.png?aa827" alt="UHC">
      <span>UHC</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('DiaPot', this)">
      <img src="https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2.png?d45f1" alt="DiaPot">
      <span>DiaPot</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('NethPot', this)">
      <img src="https://minecraft.wiki/images/Netherite_Sword_JE2_BE2.png?8e866" alt="NethPot">
      <span>NethPot</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('DiaSMP', this)">
      <img src="https://minecraft.wiki/images/Chorus_Fruit_JE2_BE2.png?c8e41" alt="DiaSMP">
      <span>DiaSMP</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('SMP', this)">
      <img src="https://minecraft.wiki/images/Shield_JE2_BE1.png?4837d" alt="SMP">
      <span>SMP</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('Mace', this)">
      <img src="https://minecraft.wiki/images/Mace_JE1_BE1.png?90f67" alt="Mace">
      <span>Mace</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('SpearMace', this)">
      <img src="https://minecraft.wiki/images/Netherite_Spear_JE1_BE2.png?8c3ba" alt="SpearMace">
      <span>SpearMace</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('Cart', this)">
      <img src="https://minecraft.wiki/images/Minecart_with_TNT_%28item%29_JE2_BE2.png?61a90" alt="Cart">
      <span>Cart</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('Crystal', this)">
      <img src="https://minecraft.wiki/images/End_Crystal_%28item%29_JE2_BE2.png?e1ecd" alt="Crystal">
      <span>Crystal</span>
    </button>
  </div>

  <div id="content"></div>

  <script>
    const icons = {
      Sword: "https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png?24296",
      Axe: "https://minecraft.wiki/images/Diamond_Axe_JE3_BE3.png?99125",
      UHC: "https://minecraft.wiki/images/Golden_Apple_JE2_BE2.png?aa827",
      DiaPot: "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2.png?d45f1",
      NethPot: "https://minecraft.wiki/images/Netherite_Sword_JE2_BE2.png?8e866",
      DiaSMP: "https://minecraft.wiki/images/Chorus_Fruit_JE2_BE2.png?c8e41",
      SMP: "https://minecraft.wiki/images/Shield_JE2_BE1.png?4837d",
      Mace: "https://minecraft.wiki/images/Mace_JE1_BE1.png?90f67",
      SpearMace: "https://minecraft.wiki/images/Netherite_Spear_JE1_BE2.png?8c3ba",
      Cart: "https://minecraft.wiki/images/Minecart_with_TNT_%28item%29_JE2_BE2.png?61a90",
      Crystal: "https://minecraft.wiki/images/End_Crystal_%28item%29_JE2_BE2.png?e1ecd"
    };

    // TABELLA VALORE PUNTI PER TIER
    const TIER_POINTS = {
      "HT1": 60, "LT1": 50,
      "HT2": 40, "LT2": 30,
      "HT3": 20, "LT3": 10,
      "HT4": 5,  "LT4": 3,
      "HT5": 2,  "LT5": 1
    };

    let playersData = [];
    let currentCategory = 'overall';

    // Calcola i punti totali basandosi sui ruoli nel JSON
    function calculatePlayerPoints(tiers) {
      if (!tiers) return 0;
      let total = 0;
      for (const mode in tiers) {
        const tier = tiers[mode];
        total += TIER_POINTS[tier] || 0;
      }
      return total;
    }

    // FUNZIONE DI CARICAMENTO DATI DA DATA.JSON
    async function fetchLiveData() {
      try {
        const response = await fetch('data.json?v=' + new Date().getTime());
        if (response.ok) {
          let rawData = await response.json();
          
          // Calcola i punti e ordina i giocatori dal più alto al più basso
          playersData = rawData.map(p => {
            p.points = calculatePlayerPoints(p.tiers);
            return p;
          }).sort((a, b) => b.points - a.points);

          renderContent();
        }
      } catch (err) {
        console.error("Errore durante il caricamento di data.json:", err);
      }
    }

    function getTierClass(tierStr) {
      if (!tierStr) return 't5';
      if (tierStr.includes('1')) return 't1';
      if (tierStr.includes('2')) return 't2';
      if (tierStr.includes('3')) return 't3';
      if (tierStr.includes('4')) return 't4';
      return 't5';
    }

    function switchCategory(category, btnElement) {
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      if(btnElement) btnElement.classList.add('active');
      currentCategory = category;
      renderContent();
    }

    function renderContent() {
      const container = document.getElementById('content');

      if (!playersData || playersData.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: #8b9bb4; font-weight:600;">Caricamento giocatori in corso o nessun giocatore registrato...</div>';
        return;
      }

      if (currentCategory === 'overall') {
        container.className = 'leaderboard-list';
        container.innerHTML = playersData.map((p, index) => {
          const rankNum = index + 1; // Posizione calcolata automaticamente in base ai punti
          const subtitle = p.subtitle || "Combat Member";
          const points = p.points || 0;
          const region = p.region || "EU";
          const tiers = p.tiers || {};

          return `
            <div class="player-card rank-${rankNum <= 3 ? rankNum : 'other'}">
              <div class="player-main-info">
                <div class="rank-tag-box">
                  <span class="rank-num">${rankNum}.</span>
                  <img class="player-avatar" src="https://render.crafty.gg/3d/bust/${p.name}" alt="${p.name}">
                </div>
                <div class="player-details">
                  <h3>${p.name}</h3>
                  <div class="title-pts">${subtitle} <span>(${points} pts)</span></div>
                </div>
              </div>

              <div class="region-container">
                <span class="region-tag ${region}">${region}</span>
              </div>

              <div class="tested-tiers-list">
                ${Object.keys(tiers).map(mode => `
                  <div class="tier-badge-item">
                    <div class="icon-circle">
                      <img src="${icons[mode] || ''}" alt="${mode}">
                    </div>
                    <span class="tier-subtext ${getTierClass(tiers[mode])}">${tiers[mode]}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }).join('');
      } else {
        container.className = 'tier-columns';
        
        container.innerHTML = [1, 2, 3, 4, 5].map(tierNum => {
          const htPlayers = playersData.filter(p => p.tiers && p.tiers[currentCategory] === `HT${tierNum}`);
          const ltPlayers = playersData.filter(p => p.tiers && p.tiers[currentCategory] === `LT${tierNum}`);
          const allTierPlayers = [...htPlayers, ...ltPlayers];

          return `
            <div class="tier-col">
              <div class="tier-header t${tierNum}-head">TIER ${tierNum}</div>
              
              ${allTierPlayers.length === 0 ? '<div style="color:#52607d; font-size:0.8rem; text-align:center; padding:10px;">Nessun player</div>' : ''}

              ${allTierPlayers.map(p => `
                <div class="tier-player-card">
                  <img src="https://render.crafty.gg/3d/bust/${p.name}" alt="${p.name}">
                  <span>${p.name}</span>
                </div>
              `).join('')}
            </div>
          `;
        }).join('');
      }
    }

    // Carica subito i dati all'apertura della pagina
    fetchLiveData();
    
    // Auto-Sync ogni 10 secondi
    setInterval(fetchLiveData, 10000);
  </script>
</body>
</html>
