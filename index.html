<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustedTiers - Leaderboard</title>
  <style>
    :root {
      --bg-dark: #0f1219;
      --card-bg: #161b26;
      --card-border: #212838;
      --gold: #ffbe2e;
      --silver: #b0c0d0;
      --bronze: #d97736;
      --grey-tier: #374151;
      --accent-blue: #5865f2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 1250px;
      margin-bottom: 25px;
    }

    .brand-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    /* BARRA MODALITÀ */
    .nav-modes {
      width: 100%;
      max-width: 1250px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 15px;
      margin-bottom: 25px;
      scrollbar-width: thin;
      scrollbar-color: #232a3b transparent;
    }

    .mode-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #8b9bb4;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.25s ease;
      min-width: 85px;
      flex-shrink: 0;
    }

    .mode-btn img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .mode-btn:hover {
      background: #1c2230;
      color: #ffffff;
      transform: translateY(-2px);
    }

    .mode-btn.active {
      background: #1e2638;
      border-color: var(--accent-blue);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.35);
    }

    #content {
      width: 100%;
      max-width: 1250px;
    }

    /* OVERALL LEADERBOARD CARD */
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-right: 20px;
      position: relative;
      overflow: hidden;
    }

    /* ETICHETTA TAGLIATA (RANK + SKIN) */
    .rank-tag-box {
      display: flex;
      align-items: center;
      background: #232a3b;
      padding: 0 25px 0 15px;
      clip-path: polygon(0 0, 88% 0, 100% 100%, 0% 100%);
      height: 75px;
      gap: 15px;
      margin-right: 15px;
    }

    .rank-num {
      font-size: 1.8rem;
      font-weight: 900;
      font-style: italic;
      color: #ffffff;
      min-width: 40px;
    }

    .player-avatar {
      width: 60px;
      height: 60px;
      object-fit: cover;
    }

    .player-main-info {
      display: flex;
      align-items: center;
      flex-grow: 1;
    }

    .player-details h3 {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
    }

    .player-details .title-pts {
      font-size: 0.85rem;
      color: #637394;
      font-weight: 600;
      margin-top: 2px;
    }

    .player-details .title-pts span {
      color: #8b9bb4;
    }

    /* PODI LUMINOSI OVERALL */
    .player-card.rank-1 {
      border-color: rgba(255, 190, 46, 0.6);
      box-shadow: 0 0 15px rgba(255, 190, 46, 0.2);
    }
    .player-card.rank-1 .rank-tag-box { background: var(--gold); }
    .player-card.rank-1 .rank-num { color: #000; }

    .player-card.rank-2 {
      border-color: rgba(176, 192, 208, 0.6);
      box-shadow: 0 0 15px rgba(176, 192, 208, 0.15);
    }
    .player-card.rank-2 .rank-tag-box { background: var(--silver); }
    .player-card.rank-2 .rank-num { color: #000; }

    .player-card.rank-3 {
      border-color: rgba(217, 119, 54, 0.6);
      box-shadow: 0 0 15px rgba(217, 119, 54, 0.15);
    }
    .player-card.rank-3 .rank-tag-box { background: var(--bronze); }
    .player-card.rank-3 .rank-num { color: #fff; }

    /* SEZIONE DESTRA OVERALL (REGION & TIERS TESTATI) */
    .right-section {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .region-tag {
      font-weight: 800;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 8px;
      color: white;
    }
    .region-tag.EU { background: #16a34a; }
    .region-tag.NA { background: #dc2626; }
    .region-tag.AS { background: #0284c7; }

    .tested-tiers-list {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .tier-badge-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .icon-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0f1219;
      border: 1px solid #2a3245;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-circle img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .tier-subtext {
      font-size: 0.7rem;
      font-weight: 800;
    }
    .tier-subtext.t1 { color: var(--gold); }
    .tier-subtext.t2 { color: var(--silver); }
    .tier-subtext.t3 { color: var(--bronze); }
    .tier-subtext.t4, .tier-subtext.t5 { color: #9ca3af; }

    /* COLONNE TIER PER LE GAMEMODES */
    .tier-columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      width: 100%;
    }

    .tier-col {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tier-header {
      text-align: center;
      padding: 10px;
      font-weight: 800;
      border-radius: 8px;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .t1-head { border: 1px solid var(--gold); color: var(--gold); background: rgba(255, 190, 46, 0.05); }
    .t2-head { border: 1px solid var(--silver); color: var(--silver); background: rgba(176, 192, 208, 0.05); }
    .t3-head { border: 1px solid var(--bronze); color: var(--bronze); background: rgba(217, 119, 54, 0.05); }
    .t4-head, .t5-head { border: 1px solid var(--grey-tier); color: #9ca3af; background: rgba(75, 85, 99, 0.05); }

    .sub-group-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: #637394;
      margin-top: 6px;
      margin-bottom: 2px;
    }

    .tier-player-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: #0f1219;
      border: 1px solid #212838;
      border-radius: 8px;
    }

    .tier-player-card img {
      width: 40px;
      height: 40px;
      object-fit: cover;
    }

    .tier-player-card span {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">TrustedTiers</div>
  </header>

  <!-- GAMEMODES NAVBAR -->
  <div class="nav-modes">
    <button class="mode-btn active" onclick="switchCategory('overall', this)">
      <img src="https://minecraft.wiki/images/Nether_Star_JE3_BE2.png" alt="Overall">
      <span>Overall</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('sword', this)">
      <img src="https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png?24296" alt="Sword">
      <span>Sword</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('axe', this)">
      <img src="https://minecraft.wiki/images/Diamond_Axe_JE3_BE3.png?99125" alt="Axe">
      <span>Axe</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('uhc', this)">
      <img src="https://minecraft.wiki/images/Golden_Apple_JE2_BE2.png?aa827" alt="UHC">
      <span>UHC</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('diapot', this)">
      <img src="https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2.png?d45f1" alt="DiaPot">
      <span>DiaPot</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('nethpot', this)">
      <img src="https://minecraft.wiki/images/Netherite_Sword_JE2_BE2.png?8e866" alt="NethPot">
      <span>NethPot</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('diasmp', this)">
      <img src="https://minecraft.wiki/images/Chorus_Fruit_JE2_BE2.png?c8e41" alt="DiaSMP">
      <span>DiaSMP</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('smp', this)">
      <img src="https://minecraft.wiki/images/Shield_JE2_BE1.png?4837d" alt="SMP">
      <span>SMP</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('mace', this)">
      <img src="https://minecraft.wiki/images/Mace_JE1_BE1.png?90f67" alt="Mace">
      <span>Mace</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('spearmace', this)">
      <img src="https://minecraft.wiki/images/Netherite_Spear_JE1_BE2.png?8c3ba" alt="SpearMace">
      <span>SpearMace</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('cart', this)">
      <img src="https://minecraft.wiki/images/Minecart_with_TNT_%28item%29_JE2_BE2.png?61a90" alt="Cart">
      <span>Cart</span>
    </button>
    <button class="mode-btn" onclick="switchCategory('endcrystal', this)">
      <img src="https://minecraft.wiki/images/End_Crystal_%28item%29_JE2_BE2.png?e1ecd" alt="Crystal">
      <span>Crystal</span>
    </button>
  </div>

  <div id="content"></div>

  <script>
    // Mappa Icone Modalità
    const icons = {
      sword: "https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png?24296",
      axe: "https://minecraft.wiki/images/Diamond_Axe_JE3_BE3.png?99125",
      uhc: "https://minecraft.wiki/images/Golden_Apple_JE2_BE2.png?aa827",
      diapot: "https://minecraft.wiki/images/Splash_Potion_of_Healing_JE2.png?d45f1",
      nethpot: "https://minecraft.wiki/images/Netherite_Sword_JE2_BE2.png?8e866",
      smp: "https://minecraft.wiki/images/Shield_JE2_BE1.png?4837d",
      mace: "https://minecraft.wiki/images/Mace_JE1_BE1.png?90f67"
    };

    // DATI OVERALL (Mostra solo dove il player è testato)
    const mockOverall = [
      {
        rank: 1, name: "Marlowww", title: "Combat Grandmaster", points: 450, region: "NA",
        testedTiers: [
          { mode: "diapot", tier: "HT1" }, { mode: "smp", tier: "HT1" }, { mode: "nethpot", tier: "HT1" },
          { mode: "mace", tier: "HT1" }, { mode: "sword", tier: "HT1" }, { mode: "uhc", tier: "LT1" }
        ]
      },
      {
        rank: 2, name: "ItzRealMe", title: "Combat Master", points: 330, region: "NA",
        testedTiers: [
          { mode: "sword", tier: "HT3" }, { mode: "diapot", tier: "HT1" }, { mode: "smp", tier: "HT1" },
          { mode: "uhc", tier: "LT2" }, { mode: "axe", tier: "LT2" }
        ]
      },
      {
        rank: 3, name: "coldified", title: "Combat Master", points: 326, region: "EU",
        testedTiers: [
          { mode: "diapot", tier: "LT1" }, { mode: "uhc", tier: "HT1" }, { mode: "smp", tier: "HT1" },
          { mode: "sword", tier: "LT1" }, { mode: "axe", tier: "LT1" }
        ]
      },
      {
        rank: 15, name: "Spawnplayer", title: "Combat Ace", points: 152, region: "AS",
        testedTiers: [
          { mode: "sword", tier: "LT2" }, { mode: "axe", tier: "HT3" }
        ]
      }
    ];

    // DATI PER LE GAMEMODES (Dividono internamente tra HT e LT)
    const mockTiers = {
      tier1: { ht: ["WeReflexy"], lt: ["K1RBE"] },
      tier2: { ht: ["Snoowwyyyyyy"], lt: ["amacq"] },
      tier3: { ht: ["_MannerL3gendOP"], lt: ["BlightMCYT"] },
      tier4: { ht: ["QuadridBoost"], lt: ["ewhu"] },
      tier5: { ht: ["ItzJacobXD"], lt: ["1105sldjfrnf"] }
    };

    function getTierClass(tierStr) {
      if (tierStr.includes('1')) return 't1';
      if (tierStr.includes('2')) return 't2';
      if (tierStr.includes('3')) return 't3';
      if (tierStr.includes('4')) return 't4';
      return 't5';
    }

    function switchCategory(category, btnElement) {
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      const container = document.getElementById('content');

      if (category === 'overall') {
        container.className = 'leaderboard-list';
        container.innerHTML = mockOverall.map(p => `
          <div class="player-card rank-${p.rank <= 3 ? p.rank : 'other'}">
            <div class="player-main-info">
              <!-- Tagliando Trapezio Grigio/Oro/Argento/Bronzo -->
              <div class="rank-tag-box">
                <span class="rank-num">${p.rank}.</span>
                <img class="player-avatar" src="https://render.crafty.gg/3d/bust/${p.name}" alt="${p.name}">
              </div>
              <div class="player-details">
                <h3>${p.name}</h3>
                <div class="title-pts">${p.title} <span>(${p.points} points)</span></div>
              </div>
            </div>

            <!-- Sezione Destra: Region + Gamemodes testate -->
            <div class="right-section">
              <span class="region-tag ${p.region}">${p.region}</span>
              <div class="tested-tiers-list">
                ${p.testedTiers.map(t => `
                  <div class="tier-badge-item">
                    <div class="icon-circle">
                      <img src="${icons[t.mode] || ''}" alt="${t.mode}">
                    </div>
                    <span class="tier-subtext ${getTierClass(t.tier)}">${t.tier}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `).join('');
      } else {
        container.className = 'tier-columns';
        container.innerHTML = [1, 2, 3, 4, 5].map(num => `
          <div class="tier-col">
            <div class="tier-header t${num}-head">TIER ${num}</div>

            <div class="sub-group-title">HT${num}</div>
            ${mockTiers[`tier${num}`].ht.map(p => `
              <div class="tier-player-card">
                <img src="https://render.crafty.gg/3d/bust/${p}" alt="${p}">
                <span>${p}</span>
              </div>
            `).join('')}

            <div class="sub-group-title">LT${num}</div>
            ${mockTiers[`tier${num}`].lt.map(p => `
              <div class="tier-player-card">
                <img src="https://render.crafty.gg/3d/bust/${p}" alt="${p}">
                <span>${p}</span>
              </div>
            `).join('')}
          </div>
        `).join('');
      }
    }

    // Avvio sulla schermata Overall
    switchCategory('overall', document.querySelector('.mode-btn.active'));
  </script>
</body>
</html>
