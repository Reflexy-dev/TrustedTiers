<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Tierlist</title>
  <style>
    :root {
      --bg-dark: #0f1219;
      --card-bg: #181d28;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    body {
      background-color: var(--bg-dark);
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* BARRA CATEGORIE (GAMEMODES) */
    .nav-modes {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 30px;
    }

    .mode-btn {
      background: var(--card-bg);
      border: 1px solid #2a3245;
      color: #a0aabf;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: all 0.3s ease;
    }

    .mode-btn img {
      width: 24px;
      height: 24px;
    }

    .mode-btn.active, .mode-btn:hover {
      border-color: #5865f2;
      color: white;
      box-shadow: 0 0 10px rgba(88, 101, 242, 0.4);
    }

    /* PODI LUMINOSI (OVERALL) */
    .leaderboard {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 900px;
      margin: 0 auto;
    }

    .player-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Glow / Scia di illuminazione per i podi */
    .player-card.rank-1 {
      border-left: 5px solid var(--gold);
      box-shadow: -5px 0 20px rgba(255, 215, 0, 0.3);
    }
    .player-card.rank-2 {
      border-left: 5px solid var(--silver);
      box-shadow: -5px 0 20px rgba(192, 192, 192, 0.3);
    }
    .player-card.rank-3 {
      border-left: 5px solid var(--bronze);
      box-shadow: -5px 0 20px rgba(205, 127, 50, 0.3);
    }

    /* GRIGLIA TIER (SELEZIONANDO UNA GAMEMODE) */
    .tier-columns {
      display: flex;
      gap: 15px;
      overflow-x: auto;
    }

    .tier-col {
      background: var(--card-bg);
      flex: 1;
      min-width: 180px;
      border-radius: 8px;
      padding: 10px;
    }

    .tier-header {
      text-align: center;
      padding: 8px;
      font-weight: bold;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    .t1 { background: rgba(255, 215, 0, 0.2); color: var(--gold); border: 1px solid var(--gold); box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
    .t2 { background: rgba(192, 192, 192, 0.2); color: var(--silver); border: 1px solid var(--silver); }
    .t3 { background: rgba(205, 127, 50, 0.2); color: var(--bronze); border: 1px solid var(--bronze); }
  </style>
</head>
<body>

  <!-- NAVIGAZIONE MODALITÀ -->
  <div class="nav-modes">
    <button class="mode-btn active" onclick="switchMode('overall')">
      <img src="https://minecraft.wiki/images/Nether_Star_JE3_BE2.png" alt="Overall">
      <span>Overall</span>
    </button>
    <button class="mode-btn" onclick="switchMode('sword')">
      <img src="https://minecraft.wiki/images/Diamond_Sword_JE3_BE3.png?24296" alt="Sword">
      <span>Sword</span>
    </button>
    <button class="mode-btn" onclick="switchMode('axe')">
      <img src="https://minecraft.wiki/images/Diamond_Axe_JE3_BE3.png?99125" alt="Axe">
      <span>Axe</span>
    </button>
    <!-- Aggiungi qui gli altri pulsanti con i link che mi hai fornito -->
  </div>

  <!-- CONTENUTO DINAMICO -->
  <div id="content" class="leaderboard">
    <!-- Qui JavaScript caricherà i player o i Tier -->
  </div>

  <script>
    // Esempio dati mockup (in seguito sostituito dalle chiamate al tuo Bot/DB)
    const overallData = [
      { rank: 1, name: "Marlowww", points: "450 pts", region: "NA" },
      { rank: 2, name: "ItzRealMe", points: "330 pts", region: "NA" },
      { rank: 3, name: "coldified", points: "326 pts", region: "EU" }
    ];

    function switchMode(mode) {
      const container = document.getElementById('content');
      if (mode === 'overall') {
        container.className = 'leaderboard';
        container.innerHTML = overallData.map(p => `
          <div class="player-card rank-${p.rank}">
            <h2>#${p.rank}</h2>
            <div>
              <h3>${p.name}</h3>
              <small>${p.points}</small>
            </div>
          </div>
        `).join('');
      } else {
        container.className = 'tier-columns';
        container.innerHTML = `
          <div class="tier-col"><div class="tier-header t1">Tier 1</div><div>Player A</div></div>
          <div class="tier-col"><div class="tier-header t2">Tier 2</div><div>Player B</div></div>
          <div class="tier-col"><div class="tier-header t3">Tier 3</div><div>Player C</div></div>
        `;
      }
    }

    // Carica Overall all'inizio
    switchMode('overall');
  </script>
</body>
</html>
